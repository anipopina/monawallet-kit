# v*タグのpushで、検証・ビルドしたパッケージ（npm pack形式のtarball）をGitHub Releaseに添付する。
# 導入側は Release のtarball URLを pnpm add / npm install で指定する（README参照）。
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check tag matches package.json version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: pnpm run check
      - run: pnpm run build
      - run: pnpm pack
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" monawallet-kit-*.tgz --title "$GITHUB_REF_NAME" --generate-notes
